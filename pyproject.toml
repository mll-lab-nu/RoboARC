[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roboarc"
version = "1.3.0"
description = "RoboARC's raw simulator interface: the benchmark's tasks as Gymnasium-compatible environments over the graded simulators"
readme = "docs/API.md"
requires-python = ">=3.11"
# numpy only: inside the published images everything else is installed (and pinned) already, so
# `pip install --no-deps -e .` (or PYTHONPATH=<repo>) is enough there. The extras pin the images' own versions.
dependencies = ["numpy"]

[project.optional-dependencies]
# the puzzle image ghcr.io/mll-lab-nu/roboarc:1.1.0 (Python 3.11); its runtime binding also needs the image's
# simulator source and torch, and the EPA-patched libmujoco (`python -m roboarc patch-mujoco`), so the image is the
# supported runtime
puzzles = ["numpy==2.3.5", "scipy==1.17.1", "mujoco==3.14.0", "warp-lang==1.18.0", "newton==1.6.1", "pillow==11.3.0"]
# the IKEA images ghcr.io/mll-lab-nu/roboarc-ikea(-sim):1.1.0 (Python 3.12), plus the EPA patch as above
ikea = ["numpy==2.5.4", "mujoco==3.14.0"]
gym = ["gymnasium>=1.0"]
test = ["pytest>=8"]

[project.scripts]
roboarc = "roboarc.__main__:main"

[tool.setuptools]
packages = ["roboarc"]

[tool.setuptools.package-data]
roboarc = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/api"]
markers = [
    "sim: needs a published image (the simulator, the frozen instances); skipped elsewhere",
    "heavy: long bit-identity replays of the reference trajectories (minutes to an hour each); run on a build host",
]
