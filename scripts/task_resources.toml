# roboarc: GPU memory 2 GB for every class (owner 10-17, board 0150 Q26: declared 7-8 GB, measured about 1 GB;
# batch_eval_live vram_profile roboarc on 24 GB cards: peak 1116 MiB)
[[rule]]
match = "^roboarc-.*-privileged$"
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 2.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 2.0
measured = "the Genesis release's numbers, kept until the MuJoCo release's own peaks are measured (its Harbor runs; MuJoCo physics on the CPU, Nyx on the GPU); GPU 2 GB: owner 10-17, board 0150 (batch_eval_live trial peak 1.1 GB on 24 GB cards)"

[[rule]]
match = "^roboarc-.*-standard$"
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 2.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 6.0
verifier_min_gpu_memory_gb = 2.0
measured = "the Genesis release's numbers, kept until the MuJoCo release's own peaks are measured (its Harbor runs; MuJoCo physics on the CPU, Nyx on the GPU); GPU 2 GB: owner 10-17, board 0150 (batch_eval_live trial peak 1.1 GB on 24 GB cards)"

# roboarc, rigid (privileged): per-class values (user 2026-10-13)
[[rule]]
match = "^roboarc-(interlocked-claws|buzz-wire-3d|cast-keyhole|cast-coil|hedgehog-in-cage|horseshoe-ring|lock-picking)-.*-privileged$"
min_cpus = 4.0
min_memory_gb = 7.0
min_gpu_memory_gb = 2.0
verifier_min_gpu_memory_gb = 2.0
measured = "partial MuJoCo measurements of 2026-10-13 (rendering off) with the protocol's margin; calibration pending; GPU 2 GB: owner 10-17, board 0150 (batch_eval_live trial peak 1.1 GB on 24 GB cards)"

