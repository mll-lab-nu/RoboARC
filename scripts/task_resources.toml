# The families released after those measurements (2026-10-23 / 24): their class's values, not their own peaks
[[rule]]
match = "^roboarc-(wire-splicing|bed-bolt|battery-replacement|caliper-sorting|clock-assembling)-"
measured = "their class's values (partial MuJoCo measurements of 2026-10-13 on the class's other families, with the protocol's margin); this family's own peaks not measured yet; GPU 2 GB: a trial's peak was about 1.1 GB on 24 GB cards"

[[limit]]
match = "^roboarc-(?!ikea-).*-privileged$"
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 16.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 16.0
measured = "the Genesis release's numbers, kept until the MuJoCo release's own peaks are measured (its Harbor runs; MuJoCo physics on the CPU, Nyx on the GPU)"

