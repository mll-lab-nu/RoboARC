schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "roboarc/roboarc-lock-picking-01-i01-privileged"
description = "RoboARC lock_picking (Franka Panda + Robotiq 2F-85, MuJoCo): produce one replayable trajectory. Pick up the two-tab key from its rest. Insert the tabbed key through all two rotor plates and the final END plate, while respecting their slots and stops. The key's leading tab is longer than its second tab, which sits one plate spacing behind it. Frozen scene instance (variation lock_picking_very_easy, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "panda_robotiq", "code-as-policy", "trajectory", "lock_picking"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "{{TOOLING_VERSION}}"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU physics, Nyx RGB)
robot = "franka-robotiq-2f85"
family = "lock_picking"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
dynamics = "static"               # scene dynamics (docs/PROTOCOL.md §2.14)
{{ORACLE}}
difficulty = "very_easy"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (the contact_weld_v1 grasp regions on lock_key)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision terminal_v6_chain_lock)"
instance_seed = 0                 # scene = environment/instance.json (variation lock_picking_very_easy, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
{{AGENT_EGRESS}}

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
