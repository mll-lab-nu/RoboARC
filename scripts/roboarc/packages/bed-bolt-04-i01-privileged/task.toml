schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/topogym-bed-bolt-04-i01-privileged"
description = "TopoGym bed_bolt (aloha, Genesis): produce one replayable trajectory. Drive the long bolt into the blind hole in the bed frame's corner block with the ratcheting L-shaped Phillips key (a cross tip on a ratchet) until its head is within 1.5 mm of the block face. Frozen scene instance (variation bed_bolt_phillips, seed 0)."
authors = [{ name = "jianwen" }]
keywords = ["robotics", "topogym", "genesis", "aloha", "code-as-policy", "trajectory", "bed_bolt"]

[metadata]
author_name = "jianwen"
tooling_version = "18"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "topogym"             # TopoGym on Genesis 1.2.1 (CPU float64 physics, Nyx RGB)
robot = "aloha"
family = "bed_bolt"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "none"
oracle_evidence = "No reference solution (no solution/). The frozen instance was validated by the build: it builds in a fresh process (seed < 2^31) and holds still under hold checks in a fresh container, and a verifier replay grades without a grader error. No graded positive yet. Human review per family (protocol \u00a72.7)."
grasp = "assisted (contact_weld_v1 on the bolt and the key, the bolt no target once the thread has caught; the grippers start empty)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision bed_bolt_seated_v1)"
instance_seed = 0                 # scene = environment/instance.json (variation bed_bolt_phillips, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 21600.0             # Agent wall-clock budget; verifier has its own budget
# egress: Harbor default (public). `scripts/set_agent_egress.py allowlist` closes it to the model APIs.

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
