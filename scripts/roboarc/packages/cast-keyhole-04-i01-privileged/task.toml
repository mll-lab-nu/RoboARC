schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "roboarc/roboarc-cast-keyhole-04-i01-privileged"
description = "RoboARC cast_keyhole (ALOHA 2, MuJoCo): produce one replayable trajectory. Separate and place the entire silver keyhole piece (`keyhole_silver`) inside the green dashed goal region. Keep the gold piece (`keyhole_gold`) on the puzzle/system side. Frozen scene instance (variation cast_keyhole_medium, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "cast_keyhole"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "{{TOOLING_VERSION}}"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "cast_keyhole"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
dynamics = "static"               # scene dynamics (docs/PROTOCOL.md §2.14)
{{ORACLE}}
difficulty = "medium"               # the variation's tier (docs/TAXONOMY.md)
grasp = "assisted (the contact_weld_v1 grasp regions on keyhole_gold, keyhole_silver)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision cast_keyhole_placement_v4_grasp_contact_2mm); the author's qualification record for this variation matches, as metadata only (record profile: default task parameters, seed 0, ALOHA EE_ABS, CPU, 25 ms World tick / 40 substeps, bilateral-contact contact_weld_v1); this instance runs CPU 2.5 ms ticks x 4 substeps with joint-position actions and frozen contact_weld_v1 grasp assistance, which the record does not cover"
instance_seed = 0                 # scene = environment/instance.json (variation cast_keyhole_medium, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
{{AGENT_EGRESS}}

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
