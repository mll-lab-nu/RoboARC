schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "robot-coding-bench/roboarc-interlocked-claws-12-i01-privileged"
description = "RoboARC interlocked_claws (ALOHA 2, MuJoCo): produce one replayable trajectory. Completely separate the two interlocked pieces and briefly hold both still. Frozen scene instance (variation interlocked_claws_rotor, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "interlocked_claws"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "{{TOOLING_VERSION}}"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "interlocked_claws"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
{{ORACLE}}
difficulty = "hard"               # the variation's tier (docs/rcb/TAXONOMY.md)
grasp = "assisted (the contact_weld_v1 pre-weld: the grippers start closed on piece_0, piece_1)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision claws_separation_v1_grasp_contact_2mm)"
instance_seed = 0                 # scene = environment/instance.json (variation interlocked_claws_rotor, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 2.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
{{AGENT_EGRESS}}

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
