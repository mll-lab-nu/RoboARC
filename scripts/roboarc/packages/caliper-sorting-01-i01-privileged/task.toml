schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "roboarc/roboarc-caliper-sorting-01-i01-privileged"
description = "RoboARC caliper_sorting (ALOHA 2, MuJoCo): produce one replayable trajectory. Measure the sleeves with the caliper and put every sleeve into the bin whose label gives its two caliper readings, then briefly hold everything still. Frozen scene instance (variation caliper_sorting_vernier, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "caliper_sorting"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "{{TOOLING_VERSION}}"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "caliper_sorting"
difficulty = "hard"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
dynamics = "static"               # scene dynamics (docs/PROTOCOL.md §2.14)
{{ORACLE}}
grasp = "assisted (the contact_weld_v1 grasp regions on caliper, sleeve_0, sleeve_1, sleeve_2, sleeve_3)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision sleeves_in_labelled_bins_v2)"
instance_seed = 0                 # scene = environment/instance.json (variation caliper_sorting_vernier, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
{{AGENT_EGRESS}}

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
