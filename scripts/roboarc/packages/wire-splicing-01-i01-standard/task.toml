schema_version = "1.3"
artifacts = [
  { source = "/data/final.json", service = "sim" },
  { source = "/data/episode.jsonl", service = "sim" },
  { source = "/data/trajectory.npz", service = "sim" },
  { source = "/data/replay.mp4", service = "sim" },
  { source = "/data/replay.last.png", service = "sim" },
  { source = "/data/episode.json", service = "sim" },             # the live result the service dumped at the episode end
  { source = "/data/server.log", service = "sim" },               # the service's own output (Harbor keeps none)
  { source = "/data/journal.f64", service = "sim" },              # crash recovery: every executed control step (float64 rows)
  { source = "/data/startups.jsonl", service = "sim" },           # crash recovery: one line per service start
  { source = "/data/startup_binding.json", service = "sim" },
  { source = "/data/replay.verdict.json", service = "sim" },
  { source = "/data/replay.frame_map.jsonl", service = "sim" },
  { source = "/data/replay.recording_manifest.json", service = "sim" },
  { source = "/data/replay.json", service = "sim" },              # the collect hook's fresh-process replay
  { source = "/data/replay.log", service = "sim" },
  "/app/output/",
]

[task]
name = "roboarc/roboarc-wire-splicing-01-i01-standard"
description = "STANDARD MODE (robot as a service, eai-standard/2.4): RoboARC wire_splicing on the same frozen instance as the privileged task. Splice the red and the blue wire: bend the red wire's bare end into an eye round the yellow rod of the bending post, thread the blue wire's bare end through the eye, wind the blue wire's bare tail round the red wire's doubled end at least 1.5 turns, at least 1 full turn of them round both strands of the doubled end together, fold the red wire's leftover end back over the coil, then let go. The agent only gets a client: get_obs (RGB, optional depth, proprioception, calibrated cameras), submit (joint_position or ee_pose chunks), stateless kinematics. No reset, no privileged state; the sim service records the episode as a trajectory and grades it."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "aloha", "standard-mode", "trajectory", "wire_splicing"]

[metadata]
author_name = "Jianwen Lyu"
task_type = "trajectory"
simulator = "roboarc"
robot = "aloha-2"
family = "wire_splicing"
difficulty = "untiered"
mode = "standard"                  # RGB + proprioception only; no object poses, no success predicate, no reset
dynamics = "static"               # scene dynamics (docs/PROTOCOL.md §2): only the robot and gravity do work; springs, contacts, screws and threads are passive
protocol = "eai-standard/2.4"
{{ORACLE}}
grasp = "assisted (contact_weld_v1 on the links of both wires: a hand holds every link of a touched wire between its pads; the grippers start empty)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision wire_splice_eye_wrap_v5)"
tooling_version = "{{TOOLING_VERSION}}"
instance_seed = 0
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
network_mode = "no-network"

[[verifier.collect]]
service = "sim"
command = "sh /srv/finalize.sh"   # end + dump + exit the service, one fresh-process replay with the video, write final.json
timeout_sec = 27000              # the end (a resume replay included) <= 1 h, the replay <= the agent's budget

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget
{{AGENT_EGRESS}}

[environment]
build_timeout_sec = 1800.0
cpus = 4
memory_mb = 16384
