schema_version = "1.3"
artifacts = ["/app/output/"]

[task]
name = "roboarc/roboarc-bed-bolt-02-i01-privileged"
description = "RoboARC bed_bolt (ALOHA 2, MuJoCo): produce one replayable trajectory. Drive the long bolt into the blind hole in the bed frame's corner block with the L-shaped Torx key (a six-lobe star tip) until its head is within 1.5 mm of the block face. Frozen scene instance (variation bed_bolt_torx, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "bed_bolt"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "{{TOOLING_VERSION}}"
task_type = "trajectory"          # trajectory | policy   (see docs/PROTOCOL.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "bed_bolt"
difficulty = "hard"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
dynamics = "static"               # scene dynamics (docs/PROTOCOL.md §2): only the robot and gravity do work; springs, contacts, screws and threads are passive
{{ORACLE}}
grasp = "assisted (contact_weld_v1 on the bolt and the key, the bolt no target once the thread has caught; the grippers start empty)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision bed_bolt_seated_v1)"
instance_seed = 0                 # scene = environment/instance.json (variation bed_bolt_torx, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
{{AGENT_EGRESS}}

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 16384

[verifier.environment]
build_timeout_sec = 1800.0
