schema_version = "1.3"
artifacts = [{ source = "/var/rcb-monitor/", service = "rcb_monitor" }, "/app/output/"]

[task]
name = "robot-coding-bench/roboarc-clock-assembling-01-i01-privileged"
description = "RoboARC clock_assembling (ALOHA 2, MuJoCo): produce one replayable trajectory. Assemble the watch movement's gear train: the four wheels on their pivots in the main plate, the train bridge over them on its pillars with every upper pivot in its hole, the two bridge screws tight; then wind the barrel through its ratchet, let go and watch the fourth wheel run. Frozen scene instance (variation clock_assembling_gear_train, seed 0)."
authors = [{ name = "Jianwen Lyu" }]
keywords = ["robotics", "roboarc", "mujoco", "aloha", "code-as-policy", "trajectory", "clock_assembling"]

[metadata]
author_name = "Jianwen Lyu"
tooling_version = "19"
task_type = "trajectory"          # trajectory | policy   (see docs/rcb/PROTOCOL.md)
simulator = "roboarc"             # RoboARC on MuJoCo 3.14.0 (CPU float64 physics, Nyx RGB)
robot = "aloha-2"
family = "clock_assembling"
mode = "privileged"               # privileged (state-based tooling, resets) | standard (robot as a service)
oracle = "full"
grasp = "assisted (the contact_weld_v1 grasp regions on clock)"
success_rule = "task-native success (goal_complete True; frozen parameters; terminal revision clock_gear_train_v3)"
instance_seed = 0                 # scene = environment/instance.json (variation clock_assembling_gear_train, eval index None); identity = dataset.toml digest
expert_time_estimate_hours = 3.0

[metadata.resources]
# minimum compute to run this task (docs/PROTOCOL.md §2.9)
min_cpus = 2.0
min_memory_gb = 7.0
min_gpu_memory_gb = 2.0
gpu_required = true
gpu_class = "any"
recommended_gpu = "L40S 48GB / RTX 4090 24GB / L4 24GB (sm_86 or newer)"
verifier_min_cpus = 2.0
verifier_min_memory_gb = 5.0
verifier_min_gpu_memory_gb = 2.0
measured = "the Genesis release's numbers, kept until the MuJoCo release's own peaks are measured (its Harbor runs; MuJoCo physics on the CPU, Nyx on the GPU); GPU 2 GB: owner 10-17, board 0150 (batch_eval_live trial peak 1.1 GB on 24 GB cards)"

[metadata.resources.limits]
# agent-phase limits in GiB (docs/PROTOCOL.md §2.10); scope: trial = every container, agent = the agent's container;
# enforced from protocol v1.2 when RCB_LIMITS_ENFORCE=1 (a violation fails the trial), otherwise recorded only
scope = "trial"
max_gpu_memory_gb = 16.0
max_memory_gb = 16.0
max_processes = 512
max_disk_gb = 10.0
disk_paths = ["/app", "/tmp", "/root"]
disk_exclude = []
sustain_sec = 60.0
window_sec = 120.0
trial_max_gpu_memory_gb = 16.0
trial_max_memory_gb = 16.0
measured = "the Genesis release's numbers, kept until the MuJoCo release's own peaks are measured (its Harbor runs; MuJoCo physics on the CPU, Nyx on the GPU)"

[metadata.resources.caps]
# docker caps per compose service, applied from protocol v1.2 (docs/PROTOCOL.md §2.10)
main = { cpus = 4.0, memory_gb = 20.0, pids = 8192 }

[metadata.seeds]
# the instances this task may run from (docs/PROTOCOL.md §2.13): the default, the ones a runner may draw
# from (a list, { from = A, to = B } or "any"), and the ones the reference solution under solution/ is for
default = 0
allowed = [0, 1, 2]
oracle = [0, 1, 2]
build = "runtime"

[verifier]
timeout_sec = 45000.0
environment_mode = "separate"     # verifier runs in its own sandbox (tests/Dockerfile); the agent container is gone by then
network_mode = "no-network"

# Resource limits (docs/PROTOCOL.md §2.10): seal the monitor's record first, before any other sidecar ends the episode.
[[verifier.collect]]
service = "rcb_monitor"
command = "python3 /opt/rcb_monitor/monitor.py seal --wait 90"
timeout_sec = 120

[agent]
timeout_sec = 10800.0             # Agent wall-clock budget; verifier has its own budget
network_mode = "allowlist"      # model APIs and package registries (scripts/set_agent_egress.py); PROTOCOL §2.11
allowed_hosts = ["chatgpt.com", "*.chatgpt.com", "auth.openai.com", "api.openai.com", "*.openai.com", "api.anthropic.com", "*.anthropic.com", "openrouter.ai", "*.openai.azure.com", "*.cognitiveservices.azure.com", "pypi.org", "files.pythonhosted.org", "deb.debian.org", "security.debian.org", "archive.ubuntu.com", "security.ubuntu.com", "snapshot.ubuntu.com"]

[environment]
build_timeout_sec = 3600.0
cpus = 4
memory_mb = 20480

[verifier.environment]
build_timeout_sec = 1800.0

[verifier.env]
RCB_LIMITS_ENFORCE = "${RCB_LIMITS_ENFORCE:-0}"
