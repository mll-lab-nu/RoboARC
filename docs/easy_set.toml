# The easy set (docs/PROTOCOL.md §4, docs/RUNNING.md "Results"): task bases KEPT in the repository and run like any
# other task, but reported apart from the main table and left OUT of the headline statistics.
#
# One entry per task base (the task name without its mode suffix); it covers every mode the base ships. Fields:
#   base       e.g. "roboarc-blanket-flatten-06-i01"
#   benchmark  the base's label, "RoboARC" (scripts/task_conventions.py BENCHMARKS)
#   reason     "shortcut": a success came through a goal looser than the task's text, or a grader shortcut (`note`: the
#              observed pattern); "owner": the benchmark's maintainers judge the task too easy or not discriminative;
#              "solved": the screening runs solved it in every mode it ships (`note`: which runs)
#   note       optional
# Read by scripts/task_conventions.py (`set_of`: "easy" / "core", recorded with each result as `set`, never part of
# `config_key`) and checked by `python3 scripts/task_conventions.py easy-set --check` (ci_checks/run_all.sh). Marking a
# task here changes none of its files: its DIGEST and the results recorded against it stay valid. A task leaves the
# set by deleting its entry (e.g. after a grader fix and a re-grade).
#
# The 15 bases below remain of the 31 selected on 2026-10-16 from the screening runs of the release before 1.0.0
# (the other 16 left main in 2.0.0, CHANGELOG.md). The "shortcut" entry succeeded only within the replay hold's
# relaxed tolerance, which the privileged grader no longer credits (docs/benchmarks/roboarc.md, "Grading replays"); it
# may return to the core set after a re-grade.

[[task]]
base = "roboarc-blanket-flatten-06-i01"
benchmark = "RoboARC"
reason = "shortcut"
note = "privileged: passed only in the replay hold's tolerance"

